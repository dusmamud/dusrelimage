# release-plz configuration — release-pr flow from day one, so no
# version is ever bumped by hand (the indycheck v0.2.0 lesson:
# `release-plz release` alone does NOT bump the version).
[workspace]
release = false
git_release_enable = false

[[package]]
name = "dusrelimage"
release = true
publish = true

[[package]]
name = "dusrelimage-cli"
release = false
publish = false

[[package]]
name = "dusrelimage-py"
release = false
publish = false

[[package]]
name = "dusrelimage-wasm"
release = false
publish = false

[[package]]
name = "dusrelimage-ffi"
release = false
publish = false

[[package]]
name = "dusrelimage-uniffi"
release = false
publish = false

# No custom [changelog] body: release-plz 0.4.3's `update` context
# provides neither {{ date }} nor {{ changes }} for a custom body
# template (both failed in CI), so the default changelog format is
# used. indycheck's release-plz.toml has no custom body either.
