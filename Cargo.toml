[workspace]
members = [
    "crates/dusrelimage",
    "crates/dusrelimage-cli",
    "crates/dusrelimage-py",
    "crates/dusrelimage-wasm",
    "crates/dusrelimage-ffi",
    "crates/dusrelimage-uniffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dusmamud/dusrelimage"
homepage = "https://github.com/dusmamud/dusrelimage"
authors = ["dusmamud"]

[workspace.dependencies]
# Exact versions the member crates use (kept in sync with the member
# Cargo.tomls — members pin these directly; this table is the record).
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "avif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
