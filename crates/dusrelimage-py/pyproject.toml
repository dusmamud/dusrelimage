[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "dusrelimage"
version = "0.1.0"
description = "Offline image toolkit — compress, resize, crop, convert, watermark, annotate, colour picker, palette, collage and pixelate. One Rust core, no network, no uploads."
readme = "README.md"
license = "MIT"
authors = [{ name = "dusmamud" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/dusmamud/dusrelimage"

[tool.maturin]
features = ["pyo3/abi3-py310"]
module-name = "dusrelimage._native"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
