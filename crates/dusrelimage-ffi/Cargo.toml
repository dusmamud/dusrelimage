[package]
name = "dusrelimage-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "C ABI bindings for dusrelimage — thin wrappers over the Rust core (the Go/PHP FFI foundation)"
publish = false

[lib]
# The cdylib is `libdusrelimage_ffi.so` / `dusrelimage_ffi.dll` /
# `libdusrelimage_ffi.dylib`, which Go (cgo) and PHP (FFI) link
# against. The staticlib is the same API for static linking. `rlib`
# is included as well — same precedent as `dusrelimage-wasm`
# (`["cdylib", "rlib"]`) — because without it cargo cannot link the
# integration tests in `tests/` at all on a bare `cargo test` run:
# cargo only builds cdylib/staticlib on `cargo build`, never for
# tests. The rlib changes nothing about the C API or the cdylib and
# staticlib artifacts; it only lets the tests resolve the symbols.
# The lib is named `dusrelimage_ffi` (not `dusrelimage`) so it does
# not collide with the core crate of the same name when a test binary
# links both.
name = "dusrelimage_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dusrelimage = { path = "../dusrelimage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
dusrelimage = { path = "../dusrelimage" }
