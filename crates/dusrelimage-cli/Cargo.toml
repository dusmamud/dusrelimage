[package]
name = "dusrelimage-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for dusrelimage — offline image toolkit"
publish = false

[[bin]]
name = "dusrelimage"
path = "src/main.rs"

[dependencies]
dusrelimage = { path = "../dusrelimage" }
clap = { version = "4", features = ["derive"] }
